name: CI

on:
  push:
    branches: [main, tauri]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # Linux would also need webkit2gtk; the app only targets macOS and Windows.
      - name: Test
        working-directory: core
        run: cargo test --locked
      - name: Lint
        working-directory: core
        run: cargo clippy --locked --all-targets -- -D warnings

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: npm ci
      # No signing key here, and updater artifacts refuse to build without one — CI
      # bundles are throwaway builds to download, never something the updater serves.
      - name: Build bundle
        shell: bash
        run: npx tauri build --bundles ${{ runner.os == 'Windows' && 'nsis' || 'app' }} --config '{"bundle":{"createUpdaterArtifacts":false}}'

      # Unsigned, so both platforms will warn on launch — but it means a Windows
      # installer is downloadable from any commit, which is the only way to try the
      # Windows build without a release.
      - uses: actions/upload-artifact@v4
        with:
          name: notchly-${{ matrix.os }}
          path: |
            core/target/release/bundle/nsis/*.exe
            core/target/release/bundle/macos/*.app
          if-no-files-found: warn
          retention-days: 14
