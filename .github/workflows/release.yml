name: Release

# Tag a commit to cut a release:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0"
        required: true

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ships two builds: Apple Silicon and Intel. A universal binary would
          # be one download, but doubles the size for everyone.
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: npm ci

      - name: Generate release notes
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          tag_name="${{ github.event.inputs.version || github.ref_name }}"
          latest_tag=$(git tag -l 'v*' --sort=-v:refname | head -n 1 || true)
          previous_tag=$(git tag -l 'v*' --sort=-v:refname | grep -v "^${tag_name}$" | head -n 1 || true)

          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "A notch-shaped panel that docks to any edge of your display." >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "### Changes" >> "$GITHUB_OUTPUT"
          if [ -n "$previous_tag" ]; then
            echo "" >> "$GITHUB_OUTPUT"
            git log "${previous_tag}..HEAD" --pretty=format:'- %s' >> "$GITHUB_OUTPUT"
          else
            echo "- Initial public release." >> "$GITHUB_OUTPUT"
          fi
          echo "" >> "$GITHUB_OUTPUT"
          echo "### Which file do I want?" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "| Platform | Download |" >> "$GITHUB_OUTPUT"
          echo "| --- | --- |" >> "$GITHUB_OUTPUT"
          echo "| macOS, Apple Silicon | the \\`aarch64.dmg\\` |" >> "$GITHUB_OUTPUT"
          echo "| macOS, Intel | the \\`x64.dmg\\` |" >> "$GITHUB_OUTPUT"
          echo "| Windows | the \\`x64-setup.exe\\` |" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "Notchly has no Dock or taskbar icon. Look for the handle on the edge of" >> "$GITHUB_OUTPUT"
          echo "your display, or its icon in the menu bar / system tray." >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "### Opening it the first time" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "These builds are not code-signed, so both systems will object." >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "**macOS** calls the app *damaged*, which is Gatekeeper's wording for" >> "$GITHUB_OUTPUT"
          echo "*not notarised*. Clear the quarantine flag:" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "\`\`\`bash" >> "$GITHUB_OUTPUT"
          echo "xattr -dr com.apple.quarantine /Applications/Notchly.app" >> "$GITHUB_OUTPUT"
          echo "\`\`\`" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "**Windows** shows *\"Windows protected your PC\"* — choose" >> "$GITHUB_OUTPUT"
          echo "**More info → Run anyway**." >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple signing secrets are deliberately not declared here. tauri-action runs
          # `security import` whenever they are present in the environment, and an
          # unset secret is an empty string — which failed every macOS build. Add them
          # back alongside a real certificate; see docs/RELEASING.md.
        with:
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: Notchly ${{ github.event.inputs.version || github.ref_name }}
          releaseBody: |
            ${{ steps.changelog.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
