name: Release

# Tag a commit to cut a release:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0"
        required: true

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ships two builds: Apple Silicon and Intel. A universal binary would
          # be one download, but doubles the size for everyone.
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple signing secrets are deliberately not declared here. tauri-action runs
          # `security import` whenever they are present in the environment, and an
          # unset secret is an empty string — which failed every macOS build. Add them
          # back alongside a real certificate; see docs/RELEASING.md.
        with:
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: Notchly ${{ github.event.inputs.version || github.ref_name }}
          releaseBody: |
            A notch-shaped panel that docks to any edge of your display.

            ### Which file do I want?

            | Platform | Download |
            | --- | --- |
            | macOS, Apple Silicon | the `aarch64.dmg` |
            | macOS, Intel | the `x64.dmg` |
            | Windows | the `x64-setup.exe` |

            Notchly has no Dock or taskbar icon. Look for the handle on the edge of
            your display, or its icon in the menu bar / system tray.

            ### Opening it the first time

            These builds are not code-signed, so both systems will object.

            **macOS** calls the app *damaged*, which is Gatekeeper's wording for
            *not notarised*. Clear the quarantine flag:

            ```bash
            xattr -dr com.apple.quarantine /Applications/Notchly.app
            ```

            **Windows** shows *"Windows protected your PC"* — choose
            **More info → Run anyway**.

            ---

            Releases are created as drafts. Replace this with the notes for the
            version before publishing.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
