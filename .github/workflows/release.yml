name: Release

# Tag a commit to cut a release:  git tag v0.3.0 && git push origin v0.3.0
# Or run this workflow manually and enter the version in the Actions UI.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0"
        required: true

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # One target at a time. Every job uploads `latest.json` to the same draft release,
      # and tauri-action does that by deleting the existing asset and writing a merged
      # one back. Run in parallel and two jobs interleave: the second holds an asset id
      # the first has already deleted, and its upload fails with a bare
      # "Not Found - update-a-release-asset".
      #
      # The build that loses the race still uploads its bundles, so the release *looks*
      # complete while `latest.json` is missing that platform — v0.8.0 shipped with no
      # `darwin-x86_64` entry, which silently offered Intel Macs no update at all.
      # Three sequential builds cost about half an hour; releases are rare and a
      # half-written updater manifest is not worth the twenty minutes.
      max-parallel: 1
      matrix:
        include:
          # macOS ships two builds: Apple Silicon and Intel. A universal binary would
          # be one download, but doubles the size for everyone.
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: npm ci

      - name: Generate release notes
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          tag_name="${{ github.event.inputs.version || github.ref_name }}"
          release_commit="HEAD"
          if git rev-parse --verify --quiet "refs/tags/${tag_name}" >/dev/null; then
            release_commit=$(git rev-list -n 1 "${tag_name}")
          fi
          previous_tag=$(git tag -l 'v*' --sort=-v:refname | awk -v current="${tag_name}" '$0 != current { print; exit }')
          app_version=$(node -p "require('./core/tauri.conf.json').version")
          expected_version="${tag_name#v}"
          if [ "$app_version" != "$expected_version" ]; then
            echo "Version mismatch: tag ${tag_name} but core/tauri.conf.json is ${app_version}" >&2
            exit 1
          fi
          repo="${{ github.repository }}"

          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "A notch-shaped panel that docks to any edge of your display." >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "### Changes" >> "$GITHUB_OUTPUT"
          if [ -n "$previous_tag" ]; then
            echo "" >> "$GITHUB_OUTPUT"
            git log "${previous_tag}..${release_commit}" --pretty=format:'- %s (%h)' >> "$GITHUB_OUTPUT"
          else
            git log "${release_commit}" --pretty=format:'- %s (%h)' >> "$GITHUB_OUTPUT"
          fi
          echo "" >> "$GITHUB_OUTPUT"
          echo "### Which file do I want?" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "| Platform | Download |" >> "$GITHUB_OUTPUT"
          echo "| --- | --- |" >> "$GITHUB_OUTPUT"
          echo "| macOS, Apple Silicon | [Download Apple Silicon DMG](https://github.com/${repo}/releases/download/${tag_name}/Notchly_${app_version}_aarch64.dmg) |" >> "$GITHUB_OUTPUT"
          echo "| macOS, Intel | [Download Intel DMG](https://github.com/${repo}/releases/download/${tag_name}/Notchly_${app_version}_x64.dmg) |" >> "$GITHUB_OUTPUT"
          echo "| Windows | [Download Windows installer](https://github.com/${repo}/releases/download/${tag_name}/Notchly_${app_version}_x64-setup.exe) |" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "Notchly has no Dock or taskbar icon. Look for the handle on the edge of" >> "$GITHUB_OUTPUT"
          echo "your display, or its icon in the menu bar / system tray." >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "### Opening it the first time" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "These builds are not code-signed, so both systems will object." >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "**macOS** calls the app *damaged*, which is Gatekeeper's wording for" >> "$GITHUB_OUTPUT"
          echo "*not notarised*. Clear the quarantine flag:" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "\`\`\`bash" >> "$GITHUB_OUTPUT"
          echo "xattr -dr com.apple.quarantine /Applications/Notchly.app" >> "$GITHUB_OUTPUT"
          echo "\`\`\`" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "**Windows** shows *\"Windows protected your PC\"* — choose" >> "$GITHUB_OUTPUT"
          echo "**More info → Run anyway**." >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple signing secrets are deliberately not declared here. tauri-action runs
          # `security import` whenever they are present in the environment, and an
          # unset secret is an empty string — which failed every macOS build. Add them
          # back alongside a real certificate; see docs/RELEASING.md.
        with:
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: Notchly ${{ github.event.inputs.version || github.ref_name }}
          releaseBody: |
            ${{ steps.changelog.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
