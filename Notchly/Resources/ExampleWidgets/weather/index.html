<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { padding: 4px 2px; }
    .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .place { font-size: 11.5px; font-weight: 600; color: var(--notchly-text); }
    .desc  { font-size: 10.5px; color: var(--notchly-text-secondary); margin-top: 2px; }
    .temp  {
      font-size: 34px; font-weight: 200; line-height: 1; letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums; color: var(--notchly-text);
    }
    .glyph { font-size: 26px; line-height: 1; }
    .grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px;
      padding-top: 10px; border-top: 1px solid var(--notchly-hairline);
    }
    .cell .k { font-size: 9px; letter-spacing: 0.5px; text-transform: uppercase; color: var(--notchly-text-tertiary); }
    .cell .v { font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--notchly-text); margin-top: 2px; }
    .status { font-size: 11px; color: var(--notchly-text-secondary); padding: 14px 0; text-align: center; }
    .status.error { color: #FF8A9B; text-align: left; }
  </style>
</head>
<body>
  <div id="status" class="status">Loading…</div>
  <div id="content" hidden>
    <div class="top">
      <div>
        <div class="place" id="place"></div>
        <div class="desc" id="desc"></div>
      </div>
      <div style="text-align:right">
        <div class="glyph" id="glyph"></div>
        <div class="temp" id="temp"></div>
      </div>
    </div>
    <div class="grid">
      <div class="cell"><div class="k">Feels like</div><div class="v" id="feels"></div></div>
      <div class="cell"><div class="k">Wind</div><div class="v" id="wind"></div></div>
      <div class="cell"><div class="k">Humidity</div><div class="v" id="humidity"></div></div>
    </div>
  </div>

  <script>
    (async () => {
      const el = (id) => document.getElementById(id);

      // WMO weather codes, condensed to the groups worth distinguishing at a glance.
      const CONDITIONS = {
        0: ['Clear', '☀️'], 1: ['Mostly clear', '🌤️'], 2: ['Partly cloudy', '⛅'], 3: ['Overcast', '☁️'],
        45: ['Fog', '🌫️'], 48: ['Rime fog', '🌫️'],
        51: ['Light drizzle', '🌦️'], 53: ['Drizzle', '🌦️'], 55: ['Heavy drizzle', '🌧️'],
        61: ['Light rain', '🌦️'], 63: ['Rain', '🌧️'], 65: ['Heavy rain', '🌧️'],
        66: ['Freezing rain', '🌧️'], 67: ['Freezing rain', '🌧️'],
        71: ['Light snow', '🌨️'], 73: ['Snow', '🌨️'], 75: ['Heavy snow', '❄️'], 77: ['Snow grains', '🌨️'],
        80: ['Showers', '🌦️'], 81: ['Showers', '🌧️'], 82: ['Violent showers', '⛈️'],
        85: ['Snow showers', '🌨️'], 86: ['Snow showers', '❄️'],
        95: ['Thunderstorm', '⛈️'], 96: ['Thunderstorm', '⛈️'], 99: ['Thunderstorm', '⛈️']
      };

      function fail(message) {
        el('status').textContent = message;
        el('status').className = 'status error';
        el('status').hidden = false;
        el('content').hidden = true;
      }

      async function load() {
        const settings = await notchly.settings.all();
        const place = (settings.place ?? 'Tbilisi').trim();
        const fahrenheit = settings.units === 'Fahrenheit';

        try {
          const geo = await notchly.http.json(
            `https://geocoding-api.open-meteo.com/v1/search?count=1&language=en&format=json&name=${encodeURIComponent(place)}`
          );
          const hit = geo.results && geo.results[0];
          if (!hit) { return fail(`Couldn't find “${place}”. Try another spelling in Settings.`); }

          const unitParams = fahrenheit
            ? '&temperature_unit=fahrenheit&wind_speed_unit=mph'
            : '';
          const data = await notchly.http.json(
            `https://api.open-meteo.com/v1/forecast?latitude=${hit.latitude}&longitude=${hit.longitude}` +
            `&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m${unitParams}`
          );

          const now = data.current;
          const [label, glyph] = CONDITIONS[now.weather_code] ?? ['—', '🌡️'];
          const degree = fahrenheit ? '°F' : '°C';
          const speed = fahrenheit ? 'mph' : 'km/h';

          el('place').textContent = [hit.name, hit.country_code].filter(Boolean).join(', ');
          el('desc').textContent = label;
          el('glyph').textContent = glyph;
          el('temp').textContent = `${Math.round(now.temperature_2m)}${degree}`;
          el('feels').textContent = `${Math.round(now.apparent_temperature)}${degree}`;
          el('wind').textContent = `${Math.round(now.wind_speed_10m)} ${speed}`;
          el('humidity').textContent = `${Math.round(now.relative_humidity_2m)}%`;

          el('status').hidden = true;
          el('content').hidden = false;
        } catch (error) {
          fail(String(error.message || error));
        }
      }

      load();
      setInterval(load, 15 * 60 * 1000);
    })();
  </script>
</body>
</html>
