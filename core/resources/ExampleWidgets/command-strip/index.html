<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { padding: 2px; display: flex; flex-direction: column; gap: 2px; }
    .row {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 8px; border-radius: 7px; cursor: pointer;
      transition: background 0.12s;
    }
    .row:hover { background: rgba(255,255,255,0.07); }
    .label {
      font-size: 10px; letter-spacing: 0.4px; text-transform: uppercase;
      color: var(--notchly-text-tertiary); flex: 0 0 auto; min-width: 74px;
    }
    .value {
      font-size: 11.5px; font-family: ui-monospace, "SF Mono", Menlo, monospace;
      color: var(--notchly-text); flex: 1 1 auto;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .value.error { color: #FF8A9B; }
    .value.pending { color: var(--notchly-text-tertiary); }
    .hint { font-size: 10px; color: var(--notchly-text-tertiary); padding: 4px 8px; }
    .denied { font-size: 11px; color: #FFC46B; padding: 10px 8px; line-height: 1.45; }
  </style>
</head>
<body>
  <div id="rows"></div>
  <div class="hint" id="hint" hidden>Click a row to copy its output.</div>

  <script>
    (async () => {
      const settings = await notchly.settings.all();
      const spec = settings.commands ?? '';
      const entries = spec.split('|')
        .map((part) => part.trim())
        .filter(Boolean)
        .map((part) => {
          const index = part.indexOf('=');
          return index === -1
            ? { label: part, command: part }
            : { label: part.slice(0, index).trim(), command: part.slice(index + 1).trim() };
        });

      const container = document.getElementById('rows');

      // The shell permission is off until the user grants it, and the bridge rejects
      // rather than failing silently — so show the reason instead of an empty widget.
      try {
        await notchly.shell.run('true');
      } catch (error) {
        container.innerHTML =
          `<div class="denied">${String(error.message || error)}</div>`;
        return;
      }

      document.getElementById('hint').hidden = false;

      for (const entry of entries) {
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML =
          `<span class="label"></span><span class="value pending">running…</span>`;
        row.querySelector('.label').textContent = entry.label;
        container.appendChild(row);

        const value = row.querySelector('.value');
        row.title = entry.command;
        row.onclick = () => notchly.clipboard.write(value.textContent);

        try {
          const result = await notchly.shell.run(entry.command, 8);
          const text = (result.stdout || result.stderr || '').trim().split('\n')[0];
          value.textContent = text || `exit ${result.code}`;
          value.className = 'value' + (result.code === 0 ? '' : ' error');
        } catch (error) {
          value.textContent = String(error.message || error);
          value.className = 'value error';
        }
      }
    })();
  </script>
</body>
</html>
