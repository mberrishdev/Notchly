name: Notchly

options:
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: YES
    ONLY_ACTIVE_ARCH: NO
    ARCHS: arm64
    # Bumped by scripts/release.sh, which edits this file and re-runs
    # `xcodegen generate` — don't hand-edit project.pbxproj's version
    # directly, it gets overwritten on the next regenerate.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Notchly:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Notchly
        excludes:
          - Info.plist
          - Notchly.entitlements
          - Resources/ExampleWidgets
      # Folder reference: the example widgets ship as directories, not as a flat
      # pile of files in Resources/, because each one is a self-contained widget.
      - path: Notchly/Resources/ExampleWidgets
        type: folder
    settings:
      base:
        PRODUCT_NAME: Notchly
        PRODUCT_BUNDLE_IDENTIFIER: com.mberrish.Notchly
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Notchly/Info.plist
        CODE_SIGN_ENTITLEMENTS: Notchly/Notchly.entitlements
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic

  NotchlyTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: NotchlyTests
    dependencies:
      - target: Notchly
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

schemes:
  Notchly:
    build:
      targets:
        Notchly: all
        NotchlyTests: [test]
    test:
      targets:
        - NotchlyTests
    run:
      config: Debug
