<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Notchly</title>
  <link rel="stylesheet" href="styles/panel.css" />
</head>
<body>
  <!-- The panel is an SVG shape on a transparent page, so the concave corners are real
       geometry rather than a rounded rectangle pretending to be a notch. -->
  <svg id="outline" aria-hidden="true">
    <defs>
      <clipPath id="panel-clip"><path id="clip-path" /></clipPath>
      <filter id="panel-shadow" x="-60%" y="-60%" width="220%" height="220%">
        <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000" flood-opacity="0.45" />
      </filter>
    </defs>
    <path id="shape" />
    <path id="hairline" />
  </svg>

  <!-- Outside the clip layer on purpose: the popover sits in the window's empty space
       beside the handle, where the notch shape's clip path would cut it away. -->
  <div id="popover" hidden></div>

  <!-- The Panel's two states, and nothing else. Both are strips against the bezel: the
       handle while closed, the strip of readings while open. -->
  <div id="clip-layer">
    <div id="content">
      <div id="idle-handle" class="idle-handle" hidden></div>
      <div id="strip" class="strip" hidden></div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
